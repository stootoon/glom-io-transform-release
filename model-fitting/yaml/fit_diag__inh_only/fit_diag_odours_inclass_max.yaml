name: "fit_diag__inh_only"
model: "Diag"

data_file: "$GLOM_IO_DATA/X0Y0_new.p"

standardization: separate
normalization: ["odour", "std"]

sampler:
  type: odours 
  n_train: 10
  split:
    mode: inclass 
    n_od_train: max 
    n_od_test: 2
    n_od_vld: 2

seeds: 50

init_args:
  λ__: "np.logspace(-8,5,27)"
  center: True
  bounds: "(None, 1.0)"
min_args:
  method: "L-BFGS-B"
  p_init: "[(i,1e-1) for i in range(-3,4)] * 3"
  options:
    ftol: 1e-8
    gtol: 1e-7
    maxfun: 1000
 
