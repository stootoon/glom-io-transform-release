name: "ffree_lat"
model:  "FreeLat"

data_file: "$GLOM_IO_DATA/X0Y0_new.p"

standardization: separate
normalization: ["odour", "std"]

sampler:
  type: odours 
  n_train: 10
  split:
    mode: outclass 
    n_od_train: max 
    n_od_test: 2
    n_od_vld: 2

seeds: 50

init_args:
  λ__: "[[v] for v in np.logspace(-3,7,21)]"  
  center: True
min_args:
  method: "L-BFGS-B"
  #method: "trust-krylov"
  #bounds: "[(-np.inf, np.inf)] * (n_cells ** 2 - n_cells)"
  p_init: "[(c/10.,1e-2) for c in (-1,0,1)]"
  tol: 1e-12
  options:
    #disp: True
    ftol: 1e-8
    gtol: 1e-7
    maxcor: 50
    maxiter: 1000
    maxfun: 5000
