name: "ffree"
model:  "Free"

data_file: "$GLOM_IO_DATA/X0Y0_new.p"

standardization: separate 
normalization: ["odour", "std"]

sampler:
  type: trials 
  n_train: 10
  split:
    mode: random 
    n_od_train: max 
    n_od_test: 0
    n_od_vld: 0

seeds: 50

init_args:
  λ__: "[[v] for v in np.logspace(2,11,19)]"  
  center: True
min_args:
  method: "TNC"
  #bounds: "[(-np.inf, np.inf)] * n_cells ** 2"
  p_init: "[(i,1e-1) for i in range(-2,3)] * 2"
  options:
     maxfun: 4000
     gtol: 5e-2
     ftol: 1e-5
     xtol: 1e-6
    
  # tol: 1e-12
#  options:
    #disp: True
#    ftol: 1e-6
#    gtol: 1e-2
#    maxcor: 50
#    maxiter: 1000
#    maxfun: 5000
