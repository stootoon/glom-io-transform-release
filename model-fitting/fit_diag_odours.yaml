name: "fit_diag"
model: "Diag"

data_file: "$GLOM_IO_DATA/X0Y0_new.p"

standardization: "separate"
normalization: ["odour", "std"]

sampler:
  type: odours
  n_train: 5
  split:
    mode: random
    n_od_train: 41
    n_od_test: 2
    n_od_vld: 2

seeds: 10

init_args:
  λ__: "np.logspace(-3,9,25)"
  center: True
