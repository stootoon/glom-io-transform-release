name: "fit_diag"
model: "Diag"

data_file: "$GLOM_IO_DATA/X0Y0_new.p"

standardization: separate 
normalization: ["odour", "std"]

sampler:
  type: trials 
  n_train: 10
  split:
    mode: random 
    n_od_train: max  
    n_od_test: 0
    n_od_vld: 0

seeds: 50

init_args:
  λ__: "np.logspace(-8,5,27)"
  center: True
min_args:
  tol: 1e-12
  p_init: "[(i,1e-1) for i in range(-3,4)] * 3"
  method: "L-BFGS-B"
  options:
    ftol: 1e-8
    gtol: 1e-8
    maxcor: 50
    maxiter: 1000
    maxfun: 5000
 
