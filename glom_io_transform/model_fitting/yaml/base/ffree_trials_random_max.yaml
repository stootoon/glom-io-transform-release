name: "ffree"
model:  "Free"

data_file: "$GLOM_IO_DATA/X0Y0_new.p"

standardization: separate
normalization: ["odour", "std"]

sampler:
  type: trials
  n_train: 10
  split:
    mode: random
    n_od_train: max
    n_od_test: 0
    n_od_vld: 0

seeds: 50

init_args:
  λ__: "[[v] for v in np.logspace(-3,7,21)]"
  center: True
min_args:
  method: "L-BFGS-B"
  #bounds: "[(-np.inf, np.inf)] * (n_cells ** 2)"
  p_init: "[(c,1e-1) for c in (0,1,2)]"
  tol: 1e-12
  options:
    ftol: 1e-8
    gtol: 1e-7
    maxcor: 50
    maxiter: 1000
    maxfun: 5000
